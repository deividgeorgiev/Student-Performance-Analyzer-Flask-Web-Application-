<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Performance Analyzer</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Student Performance Analyzer</h1>

        <form action="/analyze" method="POST">

            <label>Student name:</label>
            <input type="text" name="name" required>

            <br><br>

            <label>Minimum grade:</label>
            <input type="number" name="minimum_grade" step="0.01" required>

            <br><br>

            <label>Maximum grade:</label>
            <input type="number" name="maximum_grade" step="0.01" required>

            <br><br>

            <label>Desired grade:</label>
            <input type="number" name="desired_grade" step="0.01" required>

            <br><br>

            <label>Number of subjects:</label>
            <input
                type="number"
                id="number_of_subjects"
                name="number_of_subjects"
                min="1"
                required
                onchange="createSubjects()"
            >

            <div id="subjects"></div>

            <button type="submit">Analyze Performance</button>

        </form>

    </div>

    <script>
        function createSubjects() {

            const number = document.getElementById("number_of_subjects").value;
            const subjectsDiv = document.getElementById("subjects");

            subjectsDiv.innerHTML = "";

            for (let i = 0; i < number; i++) {

                const subjectLabel = document.createElement("label");
                subjectLabel.textContent = "Subject " + (i + 1) + ":";

                const subjectInput = document.createElement("input");
                subjectInput.type = "text";
                subjectInput.name = "subject_" + i;
                subjectInput.required = true;

                const gradeInput = document.createElement("input");
                gradeInput.type = "number";
                gradeInput.name = "grade_" + i;
                gradeInput.step = "0.01";
                gradeInput.required = true;

                subjectsDiv.appendChild(subjectLabel);
                subjectsDiv.appendChild(subjectInput);
                subjectsDiv.appendChild(gradeInput);

                subjectsDiv.appendChild(document.createElement("br"));
                subjectsDiv.appendChild(document.createElement("br"));
            }
        }
    </script>

</body>

</html>
